<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký | CONGNGHE8</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/auth.css" />

  </head>

  <body class="auth-body">
    <main class="auth-container">
      <div class="auth-logo">
        <h1>CONGNGHE8</h1>
        <p>Nền tảng học tập Công nghệ 8</p>
      </div>

      <h2 class="auth-title">Tạo tài khoản</h2>

      <form id="registerForm" class="auth-form">
        <div class="auth-field">
          <label for="teacherInvitationCode">
            Mã lời mời giáo viên
            <span style="font-weight: 400; opacity: 0.7">(Không bắt buộc)</span>
          </label>
          <input
            type="text"
            id="teacherInvitationCode"
            placeholder="Nhập mã nếu bạn được School Admin mời"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="auth-field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Nhập địa chỉ email"
            required
          />
        </div>

        <div class="auth-field">
          <label for="password">Mật khẩu</label>
          <input
            type="password"
            id="password"
            placeholder="Tạo mật khẩu (ít nhất 6 ký tự)"
            minlength="6"
            required
          />
        </div>

        <div class="auth-field">
          <label for="confirmPassword">Xác nhận mật khẩu</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Nhập lại mật khẩu"
            minlength="6"
            required
          />
        </div>

        <button type="submit" class="auth-button">Đăng ký</button>
      </form>

      <p id="authMessage" class="auth-message"></p>

      <div class="auth-link">
        Đã có tài khoản?
        <a href="dangnhap.html">Đăng nhập</a>
      </div>

      <a href="dangnhap.html" class="auth-back"> ← Quay lại trang đăng nhập </a>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
